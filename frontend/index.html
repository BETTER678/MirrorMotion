<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotionMirror — Real-Time Avatar Mirroring</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; background: #0d0d1a; overflow: hidden; }
      canvas { display: block; }

      /* Loading overlay */
      #loading-overlay {
        position: fixed; inset: 0;
        background: #0d0d1a;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 18px;
        z-index: 100;
        transition: opacity 0.6s;
      }
      #loading-overlay.hidden { opacity: 0; pointer-events: none; }

      #loading-title {
        font: 700 32px/1 "Segoe UI", sans-serif;
        color: #e879f9;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      #loading-sub {
        font: 400 14px/1 "Segoe UI", sans-serif;
        color: #a0a0c0;
      }
      .spinner {
        width: 44px; height: 44px;
        border: 4px solid rgba(168,85,247,0.2);
        border-top-color: #e879f9;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Instruction banner */
      #instructions {
        position: fixed; bottom: 76px; left: 50%;
        transform: translateX(-50%);
        background: rgba(10,10,30,0.75);
        color: #c0b0e0;
        font: 12px/1.5 "Segoe UI", sans-serif;
        padding: 8px 18px;
        border-radius: 8px;
        border: 1px solid rgba(168,85,247,0.25);
        text-align: center;
        backdrop-filter: blur(6px);
        z-index: 20;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-title">MotionMirror</div>
      <div id="loading-sub">Loading avatar &amp; connecting pose server…</div>
    </div>

    <!-- Instruction tip -->
    <div id="instructions">
      Stand ~2 m back from camera &nbsp;|&nbsp; Keep your full body visible &nbsp;|&nbsp; Start the app with <code>start.bat</code>
    </div>

    <script type="module" src="/src/main.js"></script>

    <script>
      // Hide loading overlay once THREE scene renders its first frame
      // We check for the canvas appearing
      const observer = new MutationObserver(() => {
        const canvas = document.querySelector('canvas');
        if (canvas) {
          observer.disconnect();
          setTimeout(() => {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) overlay.classList.add('hidden');
          }, 800);
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
